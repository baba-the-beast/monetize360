events {}

http {
    # Docker DNS returns every pricing-api replica; nginx round-robins across them.
    # After `--scale`, restart nginx so it re-resolves the replica list.
    upstream pricing { server pricing-api:8000; }
    upstream control { server control-api:8000; }

    client_max_body_size 1m;          # packs and batch requests are small

    server {
        listen 80;

        # hot path
        location ~ ^/v1/(price|simulate)/ {
            proxy_pass http://pricing;
            proxy_set_header X-Request-Id $request_id;
            proxy_connect_timeout 1s;
            proxy_read_timeout 2s;
            proxy_next_upstream error timeout;   # retry another replica if one dies
        }

        location = /readyz { proxy_pass http://pricing; }

        # everything else: packs, audit, replay, admin, docs, scoreboard
        location / {
            proxy_pass http://control;
            proxy_set_header X-Request-Id $request_id;
        }
    }
}
