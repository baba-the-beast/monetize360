# docker compose up --build
# Scale the hot path:  docker compose up -d --scale pricing-api=4 && docker compose restart nginx
services:
  postgres:
    image: postgres:16-alpine
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro   # runs *.sql on first start
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]   # audit stream survives restarts
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  pricing-api:                     # DECISION PLANE - stateless, scale freely
    build: .
    env_file: .env
    command: ["uvicorn", "--factory", "monetize360.api.app:create_pricing_app",
              "--host", "0.0.0.0", "--port", "8000", "--workers", "2"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    deploy:
      replicas: 2                  # minimum for availability (quiet hours)

  control-api:                     # CONTROL PLANE
    build: .
    env_file: .env
    command: ["uvicorn", "--factory", "monetize360.api.app:create_control_app",
              "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  audit-worker:
    build: .
    env_file: .env
    command: ["python", "-m", "monetize360.workers.audit_worker"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on: [pricing-api, control-api]

volumes:
  pgdata:
  redisdata:
