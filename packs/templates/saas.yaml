# yaml-language-server: $schema=../schema/pack.schema.json
domain: saas
currency: INR
signals:
  seats:
    type: int
    range: [1, 100000]
    source: request
  plan:
    type: enum
    values: [starter, pro, enterprise]
    source: request
  region:
    type: enum
    values: [india, us, eu]
    source: request
  annual: {type: bool, source: request, default: false}
base:
  op: lookup_table
  signals: [plan, region]
  rows:
  - key: [starter, india]
    value: 499
  - key: [starter, us]
    value: 799
  - key: [pro, india]
    value: 1499
  - key: [pro, us]
    value: 2399
  - key: [enterprise, india]
    value: 3999
  default: 4999
groups:
- name: volume
  stacking: first_match
  rules:
  - id: seat-tier
    when: seats >= 10
    then:
      op: tier
      signal: seats
      tiers:
      - {from: 10, pct: -10}
      - {from: 100, pct: -20}
    reason: '{seats} seats'
- name: billing
  stacking: multiply
  rules:
  - id: annual
    when: annual
    then: {op: pct, value: -15}
    reason: Annual billing
guards:
  floor: {op: pct_of_base, value: 50}
  ceiling: {op: pct_of_base, value: 100}
rounding: {step: 1, mode: half_up}
