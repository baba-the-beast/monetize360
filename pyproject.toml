[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "monetize360"
version = "0.1.0"
description = "Universal dynamic pricing engine: explainable, bounded, replayable, tamper-evident."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "jsonschema>=4.23",
    "cel-python>=0.1.5",
    "simpleeval>=1.0",          # fallback expression evaluator (see ARCHITECTURE §6)
    "psycopg[binary,pool]>=3.2",
    "redis>=5.0",
    "holidays>=0.50",
    "python-ulid>=2.7",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.100",
    "httpx>=0.27",              # FastAPI TestClient
    "locust>=2.29",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/monetize360"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: needs Postgres + Redis running"]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S"]   # S = bandit security checks
ignore = ["S101"]                    # allow assert in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]
