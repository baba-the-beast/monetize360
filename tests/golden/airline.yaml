# Golden cases: HAND-CALCULATED from docs/ENGINE_SPEC.md before the engine exists.
# Never change an expected value to make a test pass without recalculating it by hand.
# Zero-delta rows (e.g. economy cabin x1.0) are ignored by the runner.
pack: packs/templates/airline.yaml

cases:
  - name: early booking, cheapest bucket, curve between 21 and 60 days
    # band: 0.10 <= 0.20 -> 3500
    # curve at 30: 1.0 + (30-21) x (0.9-1.0)/(60-21) = 0.976923... -> 3500 x -0.023077 = -80.769 -> -80.77
    # step 1: 3419.23 -> 3419 ; ending 99: 3399 vs 3499 -> 3399 (nearer) ; delta -20.23
    inputs: { seats_sold: "0.10", days_to_departure: 30, cabin: economy }
    expect_price: "3399.00"
    expect_waterfall:
      - { step: base,              delta: "3500.00", after: "3500.00" }
      - { step: days-to-departure, delta: "-80.77",  after: "3419.23" }
      - { step: rounding,          delta: "-20.23",  after: "3399.00" }

  - name: late business booking
    # band: 0.65 -> 6200
    # curve at 3: 1.6 + 3 x (1.3-1.6)/7 = 1.4714285714... -> 6200 x 0.4714285714 = 2922.857 -> 2922.86
    # cabin x2.8: 9122.86 x 1.8 = 16421.148 -> 16421.15 -> 25544.01
    # step 1: 25544 ; ending 99: 25499 (45 away) vs 25599 (55 away) -> 25499 ; delta -45.01
    inputs: { seats_sold: "0.65", days_to_departure: 3, cabin: business }
    expect_price: "25499.00"
    expect_waterfall:
      - { step: base,              delta: "6200.00",  after: "6200.00" }
      - { step: days-to-departure, delta: "2922.86",  after: "9122.86" }
      - { step: cabin,             delta: "16421.15", after: "25544.01" }
      - { step: rounding,          delta: "-45.01",   after: "25499.00" }

  - name: max_change clamps a last-minute spike
    # band: 0.90 -> 9000 ; curve at 0 -> 1.6 -> +5400 -> 14400 ; economy x1.0 -> +0
    # reference 10000, 25% -> soft [7500, 12500] ; hard [2500, 45000] -> [7500, 12500]
    # clamp 14400 -> 12500 (binding: max_change) ; rounding 12500 -> ending 99: 12499 (1 away) ; delta -1
    inputs: { seats_sold: "0.90", days_to_departure: 0, cabin: economy, reference_price: "10000" }
    expect_price: "12499.00"
    expect_waterfall:
      - { step: base,              delta: "9000.00",  after: "9000.00" }
      - { step: days-to-departure, delta: "5400.00",  after: "14400.00" }
      - { step: max_change,        delta: "-1900.00", after: "12500.00" }
      - { step: rounding,          delta: "-1.00",    after: "12499.00" }

  - name: band boundary is inclusive, curve point exact
    # band: 0.20 <= upto 0.20 -> bucket Q 3500 (inclusive) ; curve at 21 -> exactly 1.0 -> +0
    # rounding: 3500 -> ending 99: 3499 (1 away) vs 3599 -> 3499 ; delta -1
    inputs: { seats_sold: "0.20", days_to_departure: 21, cabin: economy }
    expect_price: "3499.00"
    expect_waterfall:
      - { step: base,     delta: "3500.00", after: "3500.00" }
      - { step: rounding, delta: "-1.00",   after: "3499.00" }
